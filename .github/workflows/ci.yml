name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The client has to exist before the hostile-client suite asks the
      # server for it — one of its checks is that path traversal can't escape
      # the dist root, which needs a dist root.
      - run: npm run build
      - run: npm test
